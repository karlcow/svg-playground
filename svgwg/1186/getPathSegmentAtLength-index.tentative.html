<!doctype html>
<title>SVGPathElement.getPathSegmentAtLength() sets SVGPathSegment.index</title>
<link rel="help" href="https://w3c.github.io/svgwg/specs/paths/#__svg__SVGPathSegment__index">
<link rel="help" href="https://w3c.github.io/svgwg/specs/paths/#__svg__SVGPathElement__getPathSegmentAtLength">
<link rel="help" href="https://github.com/w3c/svgwg/issues/1186">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="support/getPathData-helpers.js"></script>

<script>
// Six legs of 100, written with relative commands. Legs 1, 3 and 5 are all
// "l 100 0", so the type and values alone do not identify the segment.
const ROUTE = "M 0 0 l 100 0 l 0 100 l 100 0 l 0 -100 l 100 0 l 0 100";

function assert_index_matches_path_data(path, segment, expectedIndex) {
  assert_not_equals(segment, null, "segment should not be null");
  assert_equals(typeof segment.index, "number", "typeof segment.index");
  assert_equals(segment.index, expectedIndex, "segment.index");
  const pathData = path.getPathData();
  assert_path_segment_equals(pathData[segment.index], segment);
}

test(() => {
  const path = createPath(ROUTE);
  const segment = path.getPathSegmentAtLength(450);
  assert_path_segment_equals(segment, { type: "l", values: [100, 0] });
  assert_index_matches_path_data(path, segment, 5);
}, "index identifies a segment that has identical earlier segments");

test(() => {
  const path = createPath(ROUTE);
  assert_index_matches_path_data(path, path.getPathSegmentAtLength(50), 1);
  assert_index_matches_path_data(path, path.getPathSegmentAtLength(250), 3);
  assert_index_matches_path_data(path, path.getPathSegmentAtLength(550), 6);
}, "index of a segment in the middle, inside and at the end of the path");

test(() => {
  const path = createPath(ROUTE);
  assert_index_matches_path_data(path, path.getPathSegmentAtLength(0), 0);
}, "distance 0 returns the leading MoveTo with index 0");

test(() => {
  const path = createPath(ROUTE);
  assert_index_matches_path_data(path, path.getPathSegmentAtLength(100), 1);
  assert_index_matches_path_data(path, path.getPathSegmentAtLength(400), 4);
}, "at an exact segment boundary, index is the one of the earlier segment");

test(() => {
  const path = createPath(ROUTE);
  assert_index_matches_path_data(path, path.getPathSegmentAtLength(-10), 0);
  assert_index_matches_path_data(path, path.getPathSegmentAtLength(1000), 6);
}, "index after clamping the distance");

test(() => {
  // The arc is a half circle of length 50 * Pi (~ 157), so distance 200
  // lands in the L. Normalization turns the arc into more than one cubic,
  // which would move the L to a later index.
  const path = createPath("M 0 0 A 50 50 0 0 1 100 0 L 200 0");
  const segment = path.getPathSegmentAtLength(200);
  assert_path_segment_equals(segment, { type: "L", values: [200, 0] });
  assert_index_matches_path_data(path, segment, 2);
}, "index refers to getPathData() without normalization (arc)");

test(() => {
  const path = createPath("M 0 0 H 100 V 100");
  const segment = path.getPathSegmentAtLength(150);
  assert_path_segment_equals(segment, { type: "V", values: [100] });
  assert_index_matches_path_data(path, segment, 2);
}, "index refers to getPathData() without normalization (H and V)");

test(() => {
  // Z draws back to (0,0) [100..200]. The MoveTo after it has no length.
  const path = createPath("M 0 0 L 100 0 Z M 200 0 L 300 0");
  assert_index_matches_path_data(path, path.getPathSegmentAtLength(150), 2);
  assert_index_matches_path_data(path, path.getPathSegmentAtLength(250), 4);
}, "index counts closepath and interior MoveTo segments");

test(() => {
  // getPathData() returns one segment per implicit repeated command.
  const path = createPath("M 0 0 L 100 0 200 0 300 0");
  const segment = path.getPathSegmentAtLength(250);
  assert_path_segment_equals(segment, { type: "L", values: [300, 0] });
  assert_index_matches_path_data(path, segment, 3);
}, "index counts implicit repeated commands one by one");

test(() => {
  const path = createPath(ROUTE);
  for (const [i, segment] of path.getPathData().entries())
    assert_false("index" in segment, `getPathData()[${i}] has no index member`);
  for (const [i, segment] of path.getPathData({ normalize: true }).entries())
    assert_false("index" in segment, `getPathData({normalize: true})[${i}] has no index member`);
}, "getPathData() does not set index");

test(() => {
  const path = createPath();
  path.setPathData([
    { type: "M", values: [0, 0], index: 7 },
    { type: "L", values: [10, 0], index: 0 },
  ]);
  assert_path_data_equals(path.getPathData(), [
    { type: "M", values: [0, 0] },
    { type: "L", values: [10, 0] },
  ]);
}, "setPathData() ignores index");

test(() => {
  const path = createPath(ROUTE);
  const segment = path.getPathSegmentAtLength(450);
  const pathData = path.getPathData();
  pathData[segment.index] = { type: "q", values: [50, -40, 100, 0] };
  path.setPathData(pathData);
  assert_path_segment_equals(path.getPathData()[5], { type: "q", values: [50, -40, 100, 0] });
  assert_path_segment_equals(path.getPathData()[1], { type: "l", values: [100, 0] });
  assert_path_segment_equals(path.getPathData()[3], { type: "l", values: [100, 0] });
}, "index can be used to replace the segment through setPathData()");
</script>
