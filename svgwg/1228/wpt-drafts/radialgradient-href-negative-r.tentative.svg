<svg xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml" width="200" height="200">
  <title>radialGradient: a negative r on the referencing gradient does not hide the template's valid r</title>
  <html:link rel="help" href="https://w3c.github.io/svgwg/svg2-draft/pservers.html#PaintServerTemplates"/>
  <html:link rel="help" href="https://github.com/w3c/svgwg/issues/1228"/>
  <html:link rel="match" href="radialgradient-href-negative-r-ref.svg"/>
  <radialGradient id="a" r="0.25">
    <stop offset="0" stop-color="gold"/>
    <stop offset="1" stop-color="navy"/>
  </radialGradient>
  <radialGradient id="g" href="#a" r="-10"/>
  <rect width="200" height="200" fill="url(#g)"/>
</svg>
